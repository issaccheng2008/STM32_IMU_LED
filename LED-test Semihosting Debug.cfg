# STM32H743VITx with an external ST-Link/V2 over SWD.
# This OpenOCD configuration is used by LED-test Semihosting Debug.launch.

source [find interface/stlink-dap.cfg]

transport select dapdirect_swd
adapter speed 4000

set CHIPNAME STM32H743VITx
set WORKAREASIZE 0x10000
set DUAL_BANK 1
set DUAL_CORE 0

source [find target/stm32h7x.cfg]

# AN4989 section 7.4.3 specifies Software system reset. With no SRST action,
# the Cortex-M target uses SYSRESETREQ for OpenOCD reset commands.
reset_config none
